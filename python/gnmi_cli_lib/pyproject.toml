[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnmi_cli_lib"
version = "2.5.0"
description = "A modular Python library for converting gNMI JSON responses into SONiC CLI output format"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "SONiC Team"}
]
keywords = ["gnmi", "sonic", "cli", "network", "switch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
gnmi-cli-convert = "gnmi_cli_lib.cli:main"

[project.urls]
Homepage = "https://github.com/sonic-net/sonic-gnmi"
Documentation = "https://github.com/sonic-net/sonic-gnmi"
Repository = "https://github.com/sonic-net/sonic-gnmi"

[tool.setuptools]
packages = [
    "gnmi_cli_lib",
    "gnmi_cli_lib.common",
    "gnmi_cli_lib.formatters",
    "gnmi_cli_lib.utils",
    "gnmi_cli_lib.real_device_tests",
]

[tool.setuptools.package-data]
"gnmi_cli_lib.real_device_tests" = ["test_data/*.json"]

[tool.pytest.ini_options]
testpaths = [".", "real_device_tests"]
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
