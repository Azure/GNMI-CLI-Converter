name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/gnmi_cli_lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Rust changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/rust-ci.yml'

      - name: Skip when no Rust changes
        if: steps.changes.outputs.rust != 'true'
        run: echo "No Rust-related changes detected; skipping Rust tests and coverage."

      - name: Set up Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable

      - name: Install cargo-tarpaulin
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run rust tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --all-targets --all-features

      - name: Enforce coverage >= 90%
        if: steps.changes.outputs.rust == 'true'
        run: cargo tarpaulin --all-features --out Xml --fail-under 90
