name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/gnmi_cli_lib

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect Rust changes
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/rust-ci.yml'

      - name: Skip when no Rust changes
        if: steps.changes.outputs.rust != 'true'
        run: echo "No Rust-related changes detected; skipping Rust tests and coverage."

      - name: Set up Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1

      - name: Install cargo-tarpaulin
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run rust tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --all-targets --all-features

      - name: Enforce coverage >= 90%
        if: steps.changes.outputs.rust == 'true'
        run: cargo tarpaulin --all-features --out Xml --fail-under 90
