name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Python Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect Python changes
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'

      - name: Skip when no Python changes
        if: steps.changes.outputs.python != 'true'
        run: echo "No Python-related changes detected; skipping Python tests."

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r gnmi_cli_lib/requirements.txt

      - name: Run tests with coverage
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=gnmi_cli_lib \
            --cov-report=term-missing \
            --cov-fail-under=90
