name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Python Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Python changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'

      - name: Skip when no Python changes
        if: steps.changes.outputs.python != 'true'
        run: echo "No Python-related changes detected; skipping Python tests."

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r gnmi_cli_lib/requirements.txt

      - name: Run tests with coverage
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=gnmi_cli_lib \
            --cov-report=term-missing \
            --cov-fail-under=90
