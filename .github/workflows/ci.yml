name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Python Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'python/**'
              - '.github/workflows/ci.yml'

      - name: Skip when no Python changes
        if: steps.changes.outputs.python != 'true'
        run: echo "No Python-related changes detected; skipping Python tests."

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tabulate>=0.9.0 natsort>=8.0.0 pytest>=7.0.0 pytest-cov>=4.0.0

      - name: Run tests with coverage
        if: steps.changes.outputs.python == 'true'
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=gnmi_cli_lib \
            --cov-report=term-missing \
            --cov-fail-under=90
