[package]
name = "gnmi_cli_lib"
version = "2.5.0"
edition = "2021"
authors = ["SONiC Team"]
description = "A modular Rust library for converting gNMI JSON responses into SONiC CLI output format"
license = "Apache-2.0"
keywords = ["gnmi", "sonic", "cli", "network", "switch"]
readme = "README.md"

[lib]
name = "gnmi_cli_lib"
path = "src/lib.rs"

[[bin]]
name = "gnmi-cli-convert"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
comfy-table = "7.1"
regex = "1.10"
lazy_static = "1.4"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
once_cell = "1.19"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
